<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Insights - Smart Diary</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <aside class="sidebar" aria-label="Primary Navigation">
        <div>
            <div class="brand">Smart Diary</div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="user_interface.html">Today</a></li>
                    <li><a href="entries.html">All Entries</a></li>
                    <li><a href="calendar.html">Calendar</a></li>
                    <li><a href="insights.html" class="active" aria-current="page">Insights</a></li>
                </ul>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button class="sidebar-btn" id="a11yToggleBtn" aria-expanded="false" aria-controls="a11yPanel" onclick="toggleA11yPanel()">Display &amp; accessibility</button>
            <button class="sidebar-btn" onclick="toggleDarkMode()">Light / dark</button>
            <a href="account.html" class="account-link">Log in</a>
            <a href="sign_up.html" class="account-link">Sign up</a>
        </div>
    </aside>

    <div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Style and Accessibility Options">
        <h3>
            <span>Display &amp; accessibility</span>
            <button class="close-drawer" aria-label="Close settings menu" onclick="toggleA11yPanel()">&times;</button>
        </h3>

        <span class="panel-section-label">Writing Font</span>
        <div class="font-switcher-row" role="group" aria-label="Select writing font">
            <button type="button" class="font-btn" id="fontSans" aria-pressed="true" onclick="setFont('default')">Sans</button>
            <button type="button" class="font-btn" id="fontSerif" aria-pressed="false" style="font-family: 'Lora', serif;" onclick="setFont('serif')">Serif</button>
            <button type="button" class="font-btn" id="fontMono" aria-pressed="false" style="font-family: 'Courier Prime', monospace;" onclick="setFont('mono')">Mono</button>
        </div>

        <span class="panel-section-label">Accessibility</span>
        <button class="a11y-option" id="btnLargeText" aria-pressed="false" onclick="toggleA11yFeature('a11y-large-text', this, 'Larger text')">Larger text</button>
        <button class="a11y-option" id="btnHighContrast" aria-pressed="false" onclick="toggleA11yFeature('a11y-high-contrast', this, 'High contrast')">High contrast</button>
        <button class="a11y-option" id="btnReadableSpacing" aria-pressed="false" onclick="toggleA11yFeature('a11y-readable-spacing', this, 'Wide spacing')">Wider letter spacing</button>
    </div>

    <main class="main-content" id="main-content">
        <div class="top-actions">
            <h1 class="date-heading">Insights</h1>
        </div>

        <!-- Filled from the user's saved entries (no placeholder numbers) -->
        <section class="insight-block" aria-labelledby="mood-heading">
            <h2 id="mood-heading" style="margin-bottom: 12px;">Moods this week</h2>
            <div id="moodRows"></div>
        </section>

        <section class="insight-block" aria-labelledby="summary-heading">
            <h2 id="summary-heading" style="margin-bottom: 10px;">Your week so far</h2>
            <p class="summary-text" id="weekSummary">Loading your entries...</p>
        </section>
    </main>

    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    <script src="entry_storage.js"></script>
    <script>
        // Count this week's (Mon-Sun) entries per mood and list repeated tags.
        async function renderInsights() {
            const rows = document.getElementById('moodRows');
            const summary = document.getElementById('weekSummary');
            let entries = [];
            try { entries = await loadDiaryEntries(); } catch (error) {
                summary.textContent = 'Could not load your entries. ' + error.message;
                return;
            }
            const now = new Date();
            const monday = new Date(now);
            monday.setHours(0, 0, 0, 0);
            monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
            const week = entries.filter(e => { const d = new Date(e.date); return !isNaN(d) && d >= monday; });

            if (!week.length) {
                rows.innerHTML = '<p class="empty-state">No check-ins yet this week. Each one adds a note to your week.</p>';
                summary.textContent = 'Once you have a few entries, this shows how your week is shaping up.';
                return;
            }

            const counts = { happy: 0, calm: 0, reflective: 0, stressed: 0 };
            week.forEach(e => { const k = moodKey(e.mood); if (k) counts[k]++; });
            const max = Math.max(1, ...Object.values(counts));
            rows.replaceChildren();
            Object.entries(counts).forEach(([key, n]) => {
                const row = document.createElement('div');
                row.className = 'mood-row';
                row.dataset.mood = key;
                const name = key[0].toUpperCase() + key.slice(1);
                row.innerHTML = `<span class="label"><span class="note" aria-hidden="true"></span>${name}</span>
                    <div class="bar-track" role="img" aria-label="${name}: ${n} of ${week.length} entries"><div class="bar-fill" style="width: ${(n / max) * 100}%"></div></div>
                    <span class="count">${n}</span>`;
                rows.appendChild(row);
            });

            const tagCounts = {};
            week.forEach(e => new Set(e.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
            const repeated = Object.entries(tagCounts).filter(([, n]) => n > 1).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([t]) => t);
            let text = `You checked in ${week.length} ${week.length === 1 ? 'time' : 'times'} this week.`;
            if (repeated.length) text += ` Tags that keep coming up: ${repeated.join(', ')}.`;
            summary.textContent = text;
        }
        renderInsights();
    </script>

    <script>
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        }

        function setFont(fontType, silent = false) {
            document.body.classList.remove('font-serif', 'font-mono');
            document.querySelectorAll('.font-btn').forEach(btn => btn.setAttribute('aria-pressed', 'false'));

            if (fontType === 'serif') {
                document.body.classList.add('font-serif');
                document.getElementById('fontSerif').setAttribute('aria-pressed', 'true');
            } else if (fontType === 'mono') {
                document.body.classList.add('font-mono');
                document.getElementById('fontMono').setAttribute('aria-pressed', 'true');
            } else {
                document.getElementById('fontSans').setAttribute('aria-pressed', 'true');
            }

            localStorage.setItem('selected-font', fontType);
            if (!silent) {
                const labels = { default: 'Modern Sans', serif: 'Editorial Serif', mono: 'Typewriter Mono' };
                showToast(`Font switched to ${labels[fontType]}`);
            }
        }

        function applySavedPreferences() {
            if (localStorage.getItem('dark-mode') === 'true') document.body.classList.add('dark-mode');
            const savedFont = localStorage.getItem('selected-font') || 'default';
            setFont(savedFont, true);

            ['a11y-large-text', 'a11y-high-contrast', 'a11y-readable-spacing'].forEach(cls => {
                if (localStorage.getItem(cls) === 'true') {
                    document.body.classList.add(cls);
                    const btnMap = { 'a11y-large-text': 'btnLargeText', 'a11y-high-contrast': 'btnHighContrast', 'a11y-readable-spacing': 'btnReadableSpacing' };
                    const btn = document.getElementById(btnMap[cls]);
                    if (btn) btn.setAttribute('aria-pressed', 'true');
                }
            });
        }
        applySavedPreferences();

        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('dark-mode', isDark);
            showToast(isDark ? 'Dark mode enabled' : 'Light mode enabled');
        }

        function toggleA11yPanel() {
            const panel = document.getElementById('a11yPanel');
            const btn = document.getElementById('a11yToggleBtn');
            const isOpen = panel.classList.toggle('open');
            btn.setAttribute('aria-expanded', isOpen);
        }

        function toggleA11yFeature(className, btn, label) {
            const isEnabled = document.body.classList.toggle(className);
            btn.setAttribute('aria-pressed', isEnabled);
            localStorage.setItem(className, isEnabled);
            showToast(`${label} ${isEnabled ? 'enabled' : 'disabled'}`);
        }
    </script>
</body>
</html>
