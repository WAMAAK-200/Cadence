<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script src="theme.js"></script>
    <title>All Entries - Cadence</title>
    <link rel="stylesheet" href="user_style.css">
    <style>
        .entry-card-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-delete {
            background: transparent;
            border: 1px solid #e0b4b4;
            color: #b91c1c;
            padding: 6px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: var(--text-xs);
            font-weight: 600;
            transition: background-color 0.15s, color 0.15s;
        }
        .btn-delete:hover {
            background: #fee2e2;
        }
        .btn-edit {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 6px 12px;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: var(--text-xs);
            font-weight: 600;
        }
        .btn-edit:hover {
            background: var(--paper-2);
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <aside class="sidebar" aria-label="Primary Navigation">
        <div>
            <a class="brand" href="welcome.html" aria-label="Cadence, about the app"><svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect x="3" y="11" width="4" height="12" rx="2" fill="var(--calm)"/><rect x="11" y="4" width="4" height="19" rx="2" fill="var(--happy)"/><rect x="19" y="14" width="4" height="9" rx="2" fill="var(--stressed)"/></svg><span>Cadence</span></a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="user_interface.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pen"></use></svg><span class="nav-label">Today</span></a></li>
                    <li><a href="entries.html" class="active" aria-current="page"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list"></use></svg><span class="nav-label">All Entries</span></a></li>
                    <li><a href="calendar.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg><span class="nav-label">Calendar</span></a></li>
                    <li><a href="insights.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wave"></use></svg><span class="nav-label">Insights</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button class="sidebar-btn" id="a11yToggleBtn" aria-expanded="false" aria-controls="a11yPanel" onclick="toggleA11yPanel()"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-sliders"></use></svg><span class="nav-label">Display &amp; accessibility</span></button>
            <button class="sidebar-btn" onclick="toggleDarkMode()"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg><span class="nav-label">Light / dark</span></button>
            <a href="account.html" class="account-link" id="navAccountLink"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg><span class="nav-label">Log in</span></a>
            <a href="sign_up.html" class="account-link" id="navSignUpLink"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user-plus"></use></svg><span class="nav-label">Sign up</span></a>
        </div>
    </aside>

    <div class="a11y-panel" id="a11yPanel" role="dialog" aria-label="Display and accessibility options">
        <h3>
            <span>Display &amp; accessibility</span>
            <button class="close-drawer" aria-label="Close settings menu" onclick="toggleA11yPanel()">&times;</button>
        </h3>

        <span class="panel-section-label">Writing Font</span>
        <div class="font-switcher-row" role="group" aria-label="Select writing font">
            <button type="button" class="font-btn" id="fontSans" aria-pressed="true" onclick="setFont('default')">Sans</button>
            <button type="button" class="font-btn" id="fontSerif" aria-pressed="false" style="font-family: 'Lora', serif;" onclick="setFont('serif')">Serif</button>
            <button type="button" class="font-btn" id="fontMono" aria-pressed="false" style="font-family: 'Courier Prime', monospace;" onclick="setFont('mono')">Mono</button>
        </div>

        <span class="panel-section-label">Accessibility</span>
        <button class="a11y-option" id="btnLargeText" aria-pressed="false" onclick="toggleA11yFeature('a11y-large-text', this, 'Larger text')"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-text-size"></use></svg><span class="nav-label">Larger text</span></button>
        <button class="a11y-option" id="btnHighContrast" aria-pressed="false" onclick="toggleA11yFeature('a11y-high-contrast', this, 'High contrast')"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-contrast"></use></svg><span class="nav-label">High contrast</span></button>
        <button class="a11y-option" id="btnReadableSpacing" aria-pressed="false" onclick="toggleA11yFeature('a11y-readable-spacing', this, 'Wide spacing')"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-spacing"></use></svg><span class="nav-label">Wider letter spacing</span></button>
    </div>

    <main class="main-content" id="main-content">
        <div class="top-actions">
            <h1 class="date-heading">All Entries</h1>
        </div>

        <div class="search-bar-row">
            <label for="searchInput" class="sr-only">Search entries</label>
            <input type="text" id="searchInput" class="search-input" maxlength="120" onkeyup="filterEntries()" placeholder="Search by word, tag (#study), or mood (happy, calm)">
            <button class="export-btn" onclick="exportEntriesText()">Export as .txt</button>
            <button class="export-btn" onclick="exportEntriesJSON()">Export .json</button>
        </div>

        <div id="entryList"></div>
    </main>

    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    <script src="icons.js"></script>
    <script src="entry_storage.js"></script>
    <script>
        let allEntries = [];

        async function initEntries() {
            try {
                allEntries = await loadDiaryEntries();
            } catch (e) {
                console.warn(e);
            }
            renderEntries(allEntries);
        }

        function filterEntries() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderEntries(allEntries);
                return;
            }

            const filtered = allEntries.filter(entry => {
                const titleMatch = (entry.title || '').toLowerCase().includes(query);
                const textMatch = (entry.text || '').toLowerCase().includes(query);
                const moodMatch = moodName(entry.mood).toLowerCase().includes(query);
                const tagMatch = (entry.tags || []).some(t => t.toLowerCase().includes(query));
                return titleMatch || textMatch || moodMatch || tagMatch;
            });

            renderEntries(filtered);
        }

        function renderEntries(entries) {
            const listContainer = document.getElementById('entryList');
            listContainer.replaceChildren();

            if (entries.length === 0) {
                const p = document.createElement('p');
                p.className = 'empty-state';
                p.textContent = 'No entries found matching your query.';
                listContainer.appendChild(p);
                return;
            }

            entries.forEach(entry => {
                const card = document.createElement('article');
                card.className = 'entry-card';

                const header = document.createElement('div');
                header.className = 'entry-card-header';

                const title = document.createElement('h3');
                title.className = 'entry-card-title';
                title.textContent = entry.title || 'Untitled Entry';

                const right = document.createElement('div');
                right.style.display = 'flex';
                right.style.gap = '8px';
                right.style.alignItems = 'center';

                const dateSpan = document.createElement('span');
                dateSpan.className = 'entry-card-date';
                dateSpan.textContent = entry.date;

                const moodSpan = document.createElement('span');
                moodSpan.className = 'mood-pill';
                renderMood(moodSpan, entry.mood);

                right.appendChild(dateSpan);
                right.appendChild(moodSpan);
                // Seeded examples are labelled so they are never mistaken for the user's own diary.
                if (isSampleEntry(entry)) {
                    const sampleTag = document.createElement('span');
                    sampleTag.className = 'sample-badge';
                    sampleTag.textContent = 'Sample';
                    sampleTag.title = 'An example entry, not yours. It is left out of your insights and music.';
                    right.appendChild(sampleTag);
                }
                header.appendChild(title);
                header.appendChild(right);
                card.appendChild(header);

                if (entry.text) {
                    const textP = document.createElement('p');
                    textP.className = 'display-text';
                    textP.textContent = entry.text;
                    card.appendChild(textP);
                }

                // Telemetry info badges
                const metaRow = document.createElement('div');
                metaRow.style.display = 'flex';
                metaRow.style.gap = '6px';
                metaRow.style.flexWrap = 'wrap';
                metaRow.style.marginBottom = '12px';

                if (entry.sleepHours !== null && entry.sleepHours !== undefined) {
                    const p = document.createElement('span');
                    p.className = 'tag-pill';
                    p.textContent = `${entry.sleepHours}h sleep`; p.insertAdjacentHTML('afterbegin', cadenceIcon('moon'));
                    metaRow.appendChild(p);
                }
                if (entry.stress !== null && entry.stress !== undefined) {
                    const p = document.createElement('span');
                    p.className = 'tag-pill';
                    p.textContent = `Stress: ${entry.stress}/10`; p.insertAdjacentHTML('afterbegin', cadenceIcon('gauge'));
                    metaRow.appendChild(p);
                }
                if (entry.fatigue !== null && entry.fatigue !== undefined) {
                    const p = document.createElement('span');
                    p.className = 'tag-pill';
                    p.textContent = `Fatigue: ${entry.fatigue}/10`; p.insertAdjacentHTML('afterbegin', cadenceIcon('battery'));
                    metaRow.appendChild(p);
                }
                if (entry.studyHours) {
                    const p = document.createElement('span');
                    p.className = 'tag-pill';
                    p.textContent = `Study: ${entry.studyHours}h`; p.insertAdjacentHTML('afterbegin', cadenceIcon('book'));
                    metaRow.appendChild(p);
                }
                if (entry.workHours) {
                    const p = document.createElement('span');
                    p.className = 'tag-pill';
                    p.textContent = `Work: ${entry.workHours}h`; p.insertAdjacentHTML('afterbegin', cadenceIcon('briefcase'));
                    metaRow.appendChild(p);
                }

                (entry.tags || []).forEach(t => {
                    const tagPill = document.createElement('span');
                    tagPill.className = 'tag-pill';
                    tagPill.textContent = t;
                    metaRow.appendChild(tagPill);
                });

                card.appendChild(metaRow);

                // Actions
                const actions = document.createElement('div');
                actions.className = 'entry-card-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'btn-edit';
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => handleEditEntry(entry);

                const delBtn = document.createElement('button');
                delBtn.className = 'btn-delete';
                delBtn.textContent = 'Delete';
                delBtn.onclick = async () => {
                    if (confirm(`Delete "${entry.title}"?`)) {
                        await deleteDiaryEntry(entry.id);
                        allEntries = await loadDiaryEntries();
                        filterEntries();
                        showToast('Entry deleted.');
                    }
                };

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                card.appendChild(actions);

                listContainer.appendChild(card);
            });
        }

        async function handleEditEntry(entry) {
            const newTitle = prompt('Edit Title:', entry.title);
            if (newTitle === null) return;
            const newText = prompt('Edit Content:', entry.text);
            if (newText === null) return;

            await updateDiaryEntry(entry.id, {
                title: newTitle.trim() || entry.title,
                text: newText.trim()
            });

            allEntries = await loadDiaryEntries();
            filterEntries();
            showToast('Entry updated!');
        }

        function exportEntriesText() {
            if (allEntries.length === 0) {
                showToast('No entries to export.');
                return;
            }

            let fileContent = "=== SMART DIARY ENTRIES EXPORT ===\n\n";
            allEntries.forEach(entry => {
                fileContent += `Date: ${entry.date}\n`;
                fileContent += `Title: ${entry.title}\n`;
                fileContent += `Mood: ${entry.mood}\n`;
                if (entry.sleepHours !== null) fileContent += `Sleep: ${entry.sleepHours} hours\n`;
                if (entry.stress !== null) fileContent += `Stress: ${entry.stress} / 10\n`;
                if (entry.studyHours) fileContent += `Study Hours: ${entry.studyHours}\n`;
                if (entry.tags && entry.tags.length) fileContent += `Tags: ${entry.tags.join(', ')}\n`;
                fileContent += `\n${entry.text}\n\n`;
                fileContent += "----------------------------------------\n\n";
            });

            downloadBlob(fileContent, 'smart-diary-export.txt', 'text/plain;charset=utf-8');
            showToast('Exported entries as .txt');
        }

        function exportEntriesJSON() {
            if (allEntries.length === 0) {
                showToast('No entries to export.');
                return;
            }
            const jsonStr = JSON.stringify(allEntries, null, 2);
            downloadBlob(jsonStr, 'smart-diary-export.json', 'application/json;charset=utf-8');
            showToast('Exported entries as .json');
        }

        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        }

        function toggleA11yPanel() {
            const panel = document.getElementById('a11yPanel');
            const btn = document.getElementById('a11yToggleBtn');
            const isOpen = panel.classList.toggle('open');
            btn.setAttribute('aria-expanded', isOpen);
        }

        function toggleDarkMode() {
            const isDark = cadenceToggleTheme() === 'dark';
            showToast(isDark ? 'Dark mode enabled' : 'Light mode enabled');
        }

        function setFont(fontType) {
            document.body.classList.remove('font-serif', 'font-mono');
            document.querySelectorAll('.font-btn').forEach(btn => btn.setAttribute('aria-pressed', 'false'));
            if (fontType === 'serif') {
                document.body.classList.add('font-serif');
                document.getElementById('fontSerif').setAttribute('aria-pressed', 'true');
            } else if (fontType === 'mono') {
                document.body.classList.add('font-mono');
                document.getElementById('fontMono').setAttribute('aria-pressed', 'true');
            } else {
                document.getElementById('fontSans').setAttribute('aria-pressed', 'true');
            }
            localStorage.setItem('selected-font', fontType);
        }

        function toggleA11yFeature(className, btn, label) {
            const isEnabled = document.body.classList.toggle(className);
            btn.setAttribute('aria-pressed', isEnabled);
            localStorage.setItem(className, isEnabled);
            showToast(`${label} ${isEnabled ? 'enabled' : 'disabled'}`);
        }

        function applySavedPreferences() {
            const savedFont = localStorage.getItem('selected-font') || 'default';
            setFont(savedFont);

            ['a11y-large-text', 'a11y-high-contrast', 'a11y-readable-spacing'].forEach(cls => {
                if (localStorage.getItem(cls) === 'true') {
                    document.body.classList.add(cls);
                    const btnMap = { 'a11y-large-text': 'btnLargeText', 'a11y-high-contrast': 'btnHighContrast', 'a11y-readable-spacing': 'btnReadableSpacing' };
                    const btn = document.getElementById(btnMap[cls]);
                    if (btn) btn.setAttribute('aria-pressed', 'true');
                }
            });

            const token = getEntrySessionToken();
            if (token && token !== 'expired') {
                document.querySelector('#navAccountLink .nav-label').textContent = 'My account';
                document.getElementById('navSignUpLink').style.display = 'none';
            }
        }

        applySavedPreferences();
        initEntries();
    </script>
</body>
</html>
