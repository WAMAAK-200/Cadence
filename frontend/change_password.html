<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script src="theme.js"></script>
    <title>Change Password - Cadence</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <aside class="sidebar" aria-label="Primary Navigation">
        <div>
            <a class="brand" href="welcome.html" aria-label="Cadence, about the app"><svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect x="3" y="11" width="4" height="12" rx="2" fill="var(--calm)"/><rect x="11" y="4" width="4" height="19" rx="2" fill="var(--happy)"/><rect x="19" y="14" width="4" height="9" rx="2" fill="var(--stressed)"/></svg><span>Cadence</span></a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="user_interface.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pen"></use></svg><span class="nav-label">Today</span></a></li>
                    <li><a href="entries.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list"></use></svg><span class="nav-label">All Entries</span></a></li>
                    <li><a href="calendar.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg><span class="nav-label">Calendar</span></a></li>
                    <li><a href="insights.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wave"></use></svg><span class="nav-label">Insights</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button class="sidebar-btn" onclick="toggleDarkMode()"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg><span class="nav-label">Light / dark</span></button>
            <a href="account.html" class="account-link session-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg><span class="nav-label">Log in</span></a>
            <a href="sign_up.html" class="account-link signup-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user-plus"></use></svg><span class="nav-label">Sign up</span></a>
        </div>
    </aside>

    <main class="main-content" id="main-content">
        <div class="top-actions">
            <h1 class="date-heading">Change password</h1>
        </div>
        <p id="password-page-status" aria-live="polite"></p>
        <form class="form-box" id="change-password-form" hidden>
            <label for="current-password" style="font-size: 14px; font-weight: 600;">Current password</label>
            <input type="password" id="current-password" required maxlength="72" autocomplete="current-password">

            <label for="new-password" style="font-size: 14px; font-weight: 600;">New password</label>
            <input type="password" id="new-password" required maxlength="72" autocomplete="new-password" aria-describedby="new-password-error">
            <small class="field-error" id="new-password-error" aria-live="polite"></small>

            <label for="confirm-password" style="font-size: 14px; font-weight: 600;">Confirm new password</label>
            <input type="password" id="confirm-password" required maxlength="72" autocomplete="new-password">
            <button type="submit" class="save-btn" style="width: 100%;">Update password</button>
        </form>
        <p class="account-switch"><a href="account.html">Back to account</a></p>
    </main>

    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <script src="icons.js"></script>
    <script src="account_nav.js"></script>
    <script>
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        }

        function toggleDarkMode() {
            const isDark = cadenceToggleTheme() === 'dark';
        }


        const sessionKey = 'smartdiary_session_token';
        const expiredSessionKey = 'smartdiary_session_expired';
        const changePasswordForm = document.getElementById('change-password-form');
        const status = document.getElementById('password-page-status');
        const signedIn = Boolean(sessionStorage.getItem(sessionKey))
            && sessionStorage.getItem(expiredSessionKey) !== 'true';
        changePasswordForm.hidden = !signedIn;
        status.textContent = signedIn
            ? 'Enter your current password and choose a new password.'
            : 'Please log in to change your password.';

        const passwordPattern = password => password.length > 8
            && new TextEncoder().encode(password).length <= 72
            && /[A-Z]/.test(password)
            && /[a-z]/.test(password)
            && /[0-9]/.test(password)
            && Array.from(password).some(char => "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~".includes(char));

        changePasswordForm.addEventListener('submit', async event => {
            event.preventDefault();
            const currentPassword = document.getElementById('current-password');
            const newPassword = document.getElementById('new-password');
            const confirmPassword = document.getElementById('confirm-password');
            const newPasswordError = document.getElementById('new-password-error');
            const newPasswordValid = passwordPattern(newPassword.value);
            newPasswordError.textContent = newPasswordValid
                ? ''
                : 'Use more than 8 characters with uppercase, lowercase, a number, and punctuation.';
            if (!newPasswordValid) return;
            if (newPassword.value === currentPassword.value) {
                newPasswordError.textContent = 'New password must be different from your current password.';
                newPassword.value = '';
                newPassword.focus();
                return;
            }
            if (newPassword.value !== confirmPassword.value) {
                newPasswordError.textContent = 'The new passwords do not match.';
                confirmPassword.value = '';
                confirmPassword.focus();
                return;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/account/password', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${sessionStorage.getItem(sessionKey)}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        current_password: currentPassword.value,
                        new_password: newPassword.value
                    })
                });
                const result = await response.json();
                if (response.status === 401) {
                    sessionStorage.removeItem(sessionKey);
                    sessionStorage.setItem(expiredSessionKey, 'true');
                    changePasswordForm.hidden = true;
                    status.textContent = 'Your session expired. Please log in again.';
                    window.updateAccountNavigation();
                }
                if (!response.ok) throw new Error(result.message || 'Password could not be updated.');
                changePasswordForm.reset();
                newPasswordError.textContent = '';
                showToast('Password updated.');
            } catch (error) {
                if (error instanceof TypeError) {
                    showToast('Could not reach the account server.');
                } else {
                    showToast(error.message);
                    if (error.message === 'Current password is incorrect.') currentPassword.value = '';
                }
            }
        });
    </script>
</body>
</html>
