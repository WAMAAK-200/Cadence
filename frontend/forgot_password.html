<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <script src="theme.js"></script>
    <title>Reset Password - Cadence</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <aside class="sidebar" aria-label="Primary Navigation">
        <div>
            <a class="brand" href="welcome.html" aria-label="Cadence, about the app"><svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true" focusable="false"><rect x="3" y="11" width="4" height="12" rx="2" fill="var(--calm)"/><rect x="11" y="4" width="4" height="19" rx="2" fill="var(--happy)"/><rect x="19" y="14" width="4" height="9" rx="2" fill="var(--stressed)"/></svg><span>Cadence</span></a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="user_interface.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-pen"></use></svg><span class="nav-label">Today</span></a></li>
                    <li><a href="entries.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-list"></use></svg><span class="nav-label">All Entries</span></a></li>
                    <li><a href="calendar.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-calendar"></use></svg><span class="nav-label">Calendar</span></a></li>
                    <li><a href="insights.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-wave"></use></svg><span class="nav-label">Insights</span></a></li>
                </ul>
            </nav>
        </div>
        <div class="sidebar-footer">
            <button class="sidebar-btn" onclick="toggleDarkMode()"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"></use></svg><span class="nav-label">Light / dark</span></button>
            <a href="account.html" class="account-link session-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user"></use></svg><span class="nav-label">Log in</span></a>
            <a href="sign_up.html" class="account-link signup-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-user-plus"></use></svg><span class="nav-label">Sign up</span></a>
        </div>
    </aside>

    <main class="main-content" id="main-content">
        <div class="top-actions">
            <h1 class="date-heading">Reset your password</h1>
        </div>
        <p style="margin-bottom: 24px;">Enter the email address associated with your account.</p>

        <form class="form-box" id="reset-form">
            <label for="reset-email" style="font-size: 14px; font-weight: 600;">Email address</label>
            <input type="email" id="reset-email" required maxlength="254" autocomplete="email" placeholder="you@example.com" aria-describedby="reset-email-error">
            <small class="field-error" id="reset-email-error" aria-live="polite"></small>
            <button type="submit" class="save-btn" style="width: 100%;">Send reset link</button>
            <p id="reset-demo-result" role="status" aria-live="polite" hidden></p>
        </form>
        <p class="account-switch"><a href="login.html">Back to log in</a></p>
    </main>

    <script src="icons.js"></script>
    <script src="account_nav.js"></script>
    <script>
        function toggleDarkMode() {
            const isDark = cadenceToggleTheme() === 'dark';
        }


        document.getElementById('reset-form').addEventListener('submit', async event => {
            event.preventDefault();
            const result = document.getElementById('reset-demo-result');
            const email = document.getElementById('reset-email');
            const emailError = document.getElementById('reset-email-error');
            emailError.textContent = '';
            result.hidden = true;
            try {
                const response = await fetch('http://127.0.0.1:8000/validate-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email.value })
                });
                const validation = await response.json();
                if (!response.ok || !validation.valid) {
                    emailError.textContent = validation.message || 'Enter a valid email address.';
                    return;
                }
                result.textContent = 'Email format is valid. Demo only: no email was sent, and your password has not changed.';
                result.hidden = false;
            } catch (error) {
                emailError.textContent = 'Could not reach the account server to validate this email.';
            }
        });
    </script>
</body>
</html>
