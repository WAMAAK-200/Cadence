<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Calendar - Smart Diary</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="brand">Smart Diary</div>
            <ul class="nav-menu">
                <li><a href="user_interface.html">Today</a></li>
                <li><a href="entries.html">All Entries</a></li>
                <li><a href="calendar.html" class="active">Calendar</a></li>
                <li><a href="insights.html">Insights</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <a href="account.html" class="account-link">👤 Account / Log In</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="calendar-controls">
            <h1 class="date-heading" id="month-year"></h1>
            <div>
                <button id="prev-month">&lt; Prev</button>
                <button id="next-month">Next &gt;</button>
            </div>
        </div>

        <div class="calendar-weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div class="calendar-days" id="calendar-days"></div>
    </main>

    <script>
        const monthYearText = document.getElementById("month-year");
        const calendarDays = document.getElementById("calendar-days");
        let currentDate = new Date();

        function renderCalendar(date) {
            calendarDays.innerHTML = "";
            const year = date.getFullYear();
            const month = date.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            
            monthYearText.innerText = `${monthNames[month]} ${year}`;
            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();

            for (let x = 0; x < firstDayIndex; x++) {
                calendarDays.appendChild(document.createElement("div"));
            }

            const today = new Date();
            for (let i = 1; i <= lastDay; i++) {
                const dayDiv = document.createElement("div");
                dayDiv.innerText = i;
                dayDiv.classList.add("day");

                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    dayDiv.classList.add("today");
                }

                dayDiv.addEventListener("click", () => {
                    alert(`Selected: ${monthNames[month]} ${i}, ${year}`);
                });

                calendarDays.appendChild(dayDiv);
            }
        }

        document.getElementById("prev-month").addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar(currentDate);
        });

        document.getElementById("next-month").addEventListener("click", () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar(currentDate);
        });

        renderCalendar(currentDate);
    </script>
</body>
</html>
