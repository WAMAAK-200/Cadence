<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Account - Smart Diary</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="brand">Smart Diary</div>
            <ul class="nav-menu">
                <li><a href="user_interface.html">Today</a></li>
                <li><a href="entries.html">All Entries</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="insights.html">Insights</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="theme-toggle-btn" onclick="document.body.classList.toggle('dark-mode')">🌙 Toggle Theme</button>
            <a href="account.html" class="account-link active">👤 Account / Log In</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-actions">
            <h1 class="date-heading">Welcome To Your Smart Diary</h1>
        </div>
        <p style="color: #777; margin-bottom: 24px;">Sign in to sync your entries across devices.</p>

        <form class="form-box" id="account-form">
            <label for="username" style="font-size: 14px; font-weight: 600;">Username</label>
            <input id="username" name="username" type="text" required minlength="3" maxlength="32" autocomplete="username" placeholder="Your username" aria-describedby="username-error">
            <small class="field-error" id="username-error" aria-live="polite"></small>

            <label for="password" style="font-size: 14px; font-weight: 600;">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" aria-describedby="password-error">
            <small class="field-error" id="password-error" aria-live="polite"></small>

            <button type="submit" class="save-btn" style="width: 100%;">Log In</button>
            <p id="account-message" role="status" aria-live="polite"></p>
        </form>
        <p class="account-switch">New here? <a href="sign_up.html">Create an account</a></p>
    </main>

    <script>
        document.getElementById('account-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('account-message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const usernameValid = /^[A-Za-z0-9_]{3,32}$/.test(username);
            const passwordValid = password.length > 8
                && /[A-Z]/.test(password)
                && /[a-z]/.test(password)
                && /[0-9]/.test(password)
                && Array.from(password).some(char => "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~".includes(char));

            document.getElementById('username-error').textContent = usernameValid
                ? '' : 'Use 3–32 characters: letters, numbers, or underscores.';
            document.getElementById('password-error').textContent = passwordValid
                ? '' : 'Use more than 8 characters with uppercase, lowercase, a number, and punctuation.';
            if (!usernameValid || !passwordValid) {
                message.textContent = '';
                return;
            }
            message.textContent = 'Checking…';
            try {
                const response = await fetch('http://127.0.0.1:8000/validate-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });
                if (!response.ok) throw new Error('Could not check these details.');
                const result = await response.json();
                message.textContent = result.message;
            } catch (error) {
                message.textContent = 'Could not reach the validation server. Start it with: python security.py';
            }
        });

        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('username-error').textContent = '';
        });
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('password-error').textContent = '';
        });
    </script>

</body>
</html>
