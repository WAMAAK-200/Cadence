<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Account - Smart Diary</title>
    <link rel="stylesheet" href="user_style.css">
</head>
<body>

    <aside class="sidebar">
        <div>
            <div class="brand">Smart Diary</div>
            <ul class="nav-menu">
                <li><a href="user_interface.html">Today</a></li>
                <li><a href="entries.html">All Entries</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="insights.html">Insights</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button class="theme-toggle-btn" onclick="document.body.classList.toggle('dark-mode')">🌙 Toggle Theme</button>
            <a href="account.html" class="account-link active">👤 Account / Log In</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-actions">
            <h1 class="date-heading">Welcome To Your Smart Diary</h1>
        </div>
        <p style="color: #777; margin-bottom: 24px;">Sign in to sync your entries across devices.</p>

        <form class="form-box" onsubmit="event.preventDefault(); alert('Ready for backend authentication API!');">
            <label style="font-size: 14px; font-weight: 600;">Email</label>
            <input type="email" required placeholder="you@example.com">

            <label style="font-size: 14px; font-weight: 600;">Password</label>
            <input type="password" required placeholder="••••••••">

            <button type="submit" class="save-btn" style="width: 100%;">Log In</button>
        </form>
    </main>

</body>
</html>
